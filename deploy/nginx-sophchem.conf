# /etc/nginx/sites-available/sophchem
#
# 2 server block:
#   1) __DOMAIN__ / www.__DOMAIN__  -> Next.js (PM2, 127.0.0.1:3000)
#   2) __API_DOMAIN__               -> Laravel public/ (PHP-FPM 8.3) + /admin + /storage
#
# Trước khi dùng, thay placeholder (xem deploy/README.md bước 1):
#   __DOMAIN__      tên miền chính, KHÔNG kèm www
#   __API_DOMAIN__  subdomain API, vd api.sophchem.com
#   __APP_DIR__     thư mục chứa repo trên VPS, vd /var/www/sophchem
#
# Sau khi symlink sang sites-enabled + `nginx -t`, chạy certbot --nginx để nó
# tự thêm block 443 + redirect http->https cho cả 2 server_name ở trên.

# ---------------------------------------------------------------------------
# 1) Website Next.js
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Dùng nếu chạy certbot --webroot thay vì --nginx
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # App SSR gọi API nội bộ ở mỗi request (layout + middleware),
        # nên tắt buffer để giảm TTFB và giữ timeout đủ rộng.
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Asset build của Next.js: có hash trong tên file => cache vĩnh viễn.
    # Route /_next/static không bị middleware của app set Cache-Control: no-store.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # (Tuỳ chọn) Ép về 1 domain canonical, tránh trùng lặp SEO giữa www và non-www.
    # Bật sau khi đã chốt NEXT_PUBLIC_SITE_URL theo domain canonical.
    # Lưu ý: cần chứng chỉ SSL cho cả 2 tên miền.
    # if ($host != "__DOMAIN__") {
    #     return 301 https://__DOMAIN__$request_uri;
    # }
}

# ---------------------------------------------------------------------------
# 2) Laravel API + Admin CMS + ảnh upload
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    root __APP_DIR__/be/public;
    index index.php;
    charset utf-8;

    # Upload ảnh sản phẩm / tài liệu / media trong CMS
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Ảnh upload: public/storage -> storage/app/public (php artisan storage:link)
    location /storage/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Asset build của Inertia/Vite
    location /build/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
